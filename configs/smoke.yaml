# Smoke-test config: tiny toy corpus, tiny models, CPU-friendly (< 2 min).
# Every value here is a placeholder chosen only to make the pipeline run fast;
# none of them are tuned. Copy this file for real runs and set your own values.

seed: 0
output_dir: runs/smoke
device: auto            # auto | cpu | cuda

data:
  source: toy           # toy | tinystories | path/to/file.txt
  max_sentences: 3000   # toy only
  max_stories: null     # tinystories only
  min_len: 3
  max_len: 12
  cipher_fraction: 0.5  # share of cleaned sentences used for the cipher pool
  vocab_size: 60
  n_cipher_sentences: 300
  n_english_sentences: 1000

cipher:
  alphabet_size: 8
  min_code_len: 1
  max_code_len: 3
  length_mode: random   # random | correlated

segmentation:
  methods: [oracle, perturbed, entropy, dp_unigram, hdp_bigram, charlm]
  perturbed:
    rate: 0.1
  entropy:
    context: 2
    quantile: 0.5
  dp_unigram:
    alpha0: 20
    p_stop: 0.5
    tau: 2
    iterations: 20
    anneal_start_temp: 5
    anneal_steps: 5
    init_boundary_prob: 0.5
  hdp_bigram:
    alpha0: 100
    alpha1: 10
    p_stop: 0.5
    tau: 2
    iterations: 20
    anneal_start_temp: 5
    anneal_steps: 5
    init_boundary_prob: 0.5
  charlm:
    quantile: 0.5
    model: {arch: decoder3, d_model: 32, n_layers: 1, n_heads: 2, n_kv_heads: 1, d_ff: 64,
            max_seq_len: 64, dropout: 0.0, pos_emb_type: rope, norm_first: true}
    train: {steps: 50, batch_size: 32, lr: 3.0e-3, min_lr: 3.0e-4, warmup_steps: 5,
            weight_decay: 0.0, grad_clip: 1.0, amp: none, log_every: 0}

decipherment:
  segmentations: null   # null = every segmentation above
  methods: [freq, em, search_ngram2, search_ngram3, search_neural, search_llm, llm_refine, em_pairs, embed_align]
  em:
    lm_order: 2
    start_k: 20
    step_k: 20
    iterations: 5
    fix_threshold: 0.5
    smoothing: 1.0e-3
    stretch: 3
    beam: 20
    batch_size: 256
    max_cipher_types: 500
    pairs: 10             # em_pairs: number of English word-pair states
  embed:                # embed_align
    dim: 30
    window: 2
    max_types: 60
    init_types: 60
    iterations: 5
  search:
    init: em            # em | freq
    steps: 300
    t_start: 1.0
    t_end: 0.05
    max_sentences: 200
    rank_window: 5
    top_k: 10           # search_llm: LLM candidates per cipher unit
    refresh_every: 100  # search_llm: recompute LLM candidates every N steps
    candidate_prob: 0.8 # search_llm: share of proposals drawn from LLM candidates
    log_every: 0
  refine:               # llm_refine
    init: em            # em | freq | search_ngram2 | ...
    rounds: 2
    max_sentences: 200
    min_share: 0.3      # a unit is reassigned only if this share of its occurrences agree

# From-scratch LLM (team's DecoderLM). Used by search_neural, search_llm, llm_refine.
llm:
  checkpoint_dir: null      # null = <output_dir>/llm ; share across runs to train once
  reuse_checkpoints: true   # load lm.pt / corrector.pt from checkpoint_dir if present
  score_batch_size: 256
  model: {arch: decoder3, d_model: 32, n_layers: 1, n_heads: 2, n_kv_heads: 1, d_ff: 64,
          max_seq_len: 32, dropout: 0.0, pos_emb_type: rope, norm_first: true}
  pretrain: {steps: 50, batch_size: 32, lr: 3.0e-3, min_lr: 3.0e-4, warmup_steps: 5,
             weight_decay: 0.0, grad_clip: 1.0, amp: none, eval_every: 25, val_fraction: 0.1,
             log_every: 0}
  corrector:                # SFT stage; max_seq_len must be >= 2 * data.max_len + 2
    technique: {name: lora, r: 4, alpha: 8, targets: [q_proj, v_proj]}
    kd: null                # or {teacher_checkpoint: path/to/corrector.pt, temperature: .., alpha: ..}
    corrupt_min: 0.1        # fraction of word types corrupted per batch ~ U[min, max]
    corrupt_max: 0.5
    rank_window: 5          # replacements come from +-window frequency ranks
    steps: 50
    batch_size: 32
    lr: 3.0e-3
    min_lr: 3.0e-4
    warmup_steps: 5
    weight_decay: 0.0
    grad_clip: 1.0
    amp: none               # none | bf16 | fp16
    eval_every: 25
    val_fraction: 0.1
    log_every: 0

evaluation:
  freq_bands: [[1, 1], [2, 9], [10, null]]
